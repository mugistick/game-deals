  <style>
    :root {

      --bg-main: #0b0f17;
      --bg-card: #151c28;
      --bg-card-top3: #182232;
      --bg-panel: #1d2636;
      --bg-subtle: #253042;
      --border: #334155;
      --border-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-body: #e2e8f0;
      --text-sub: #cbd5e1;

      /* 色相の完全分離：
         1. 緑色は「メイン購入ボタン」専用（他には一切使わない！）
         2. 割引バッジは「ホットオレンジ/レッド」でセール感を演出

      --discount-bg: #ea580c;
      --discount-border: #fb923c;
      --good-blue: #38bdf8;
      --warn-amber: #fbbf24;
      --bad-red: #f87171;

    * { box-sizing: border-box; margin: 0; padding: 0; }

      min-height: 100vh;
      padding-bottom: 60px;
    }
    a { color: inherit; text-decoration: none; }

    .top-banner {
      background: rgba(11, 15, 23, 0.92);
      padding: 12px 20px 8px;
    }
    .top-banner-inner {
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .top-banner h1 {
      font-size: 1.28rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .top-banner p {
      color: var(--text-sub);
      font-size: 0.84rem;
    }
    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 11px;
      border-radius: 999px;
    }

    /* Slim Sticky Bar */
    .sticky-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 15, 23, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      backdrop-filter: blur(10px);
    }
    .controls-wrap {
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--good-blue);
      color: #fff;
    }
    .search-sort-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .input-box, .select-box {

      color: #fff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.83rem;
      outline: none;
    }
    .input-box::placeholder {
      color: var(--text-sub);

    .input-box:focus, .select-box:focus {

      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);

      margin: 18px auto;
      padding: 0 18px;

    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(550px, 1fr));
      gap: 20px;
    }
    @media (max-width: 620px) {
      .deals-grid { grid-template-columns: 1fr; }
    }

    .deal-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    }
    .deal-card:hover {
      border-color: #64748b;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
    }

    .deal-card.top-pick {
      background: linear-gradient(160deg, var(--bg-card-top3) 0%, var(--bg-card) 100%);
      border: 1.5px solid rgba(245, 158, 11, 0.65);
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.12);

    .top-pick-ribbon {

      align-items: center;
      gap: 5px;
      background: linear-gradient(90deg, #f59e0b, #d97706);

      border-radius: 5px;
      width: fit-content;
      margin-bottom: -2px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35);
    }

    /* Card Top: 左に画像、右にタイトル＆価格塊 */
    .card-top {
      display: flex;
      gap: 15px;
      align-items: flex-start;
    }
    .card-thumb {
      position: relative;
      width: 196px;
      min-width: 196px;
      aspect-ratio: 460 / 215;
      border-radius: 8px;
      overflow: hidden;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
      display: block;

    @media (max-width: 540px) {
      .card-top { flex-direction: column; }

      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s;
    }

    .price-cluster {

      align-items: flex-end;
      line-height: 1.15;

      text-decoration: line-through;

    .new-price {
      font-size: 1.18rem;
      font-weight: 900;
      color: #ffffff;
    }

    .meta-row {

      flex-wrap: wrap;
      gap: 6px;
      align-items: center;

    .score-pill {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.79rem;
      padding: 2px 9px;
      border-radius: 5px;

    .score-pill strong {
      color: var(--good-blue);
      font-size: 0.85rem;

      flex-shrink: 0;

    .point-icon-warn {

      flex-shrink: 0;

    .point-icon-bad {
      color: var(--bad-red);

    .cta-section {
      margin-top: auto;

      gap: 7px;
      width: 100%;
      min-width: 0;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }
    @media (max-width: 560px) {
      .primary-cta-row { grid-template-columns: 1fr; }
    }
    .btn-steam-main, .btn-amazon-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      text-align: center;
      transition: all 0.15s;
      white-space: nowrap;
      min-width: 0;

    .btn-steam-main {

      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.28);
    }
    .btn-steam-main:hover {

      transform: translateY(-1px);
    }
    .btn-amazon-main {
      background: var(--bg-subtle);
      border: 1px solid #f59e0b;
      color: #fbbf24;
    }
    .btn-amazon-main:hover {
      background: rgba(245, 158, 11, 0.18);
      color: #fff;
      transform: translateY(-1px);
    }

    /* 下段の補足テキストリンク行 */
    .sub-links-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.77rem;
      color: var(--text-sub);
      padding: 0 2px;
    }
    .context-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .text-link {
      color: var(--text-sub);
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .text-link:hover {
      color: var(--good-blue);
      text-decoration: underline;
    }
  </style>

    document.getElementById("updatedAt").textContent = DEALS_DATA.updated_at;

    let currentFilter = "all";
    let currentSearch = "";
    let currentSort = "score";

    function buildExternalLinks(game) {
      const aff = DEALS_DATA.affiliate || {};
      const encodedJa = encodeURIComponent(game.name);
      const encodedEn = encodeURIComponent(game.name_en || game.name);
      const fanaticalUrl = `https://www.fanatical.com/ja/search?search=${encodedEn}&ref=${aff.fanatical_ref || ''}`;
      const amazonControllerUrl = `https://www.amazon.co.jp/s?k=${ encodeURIComponent('PC ゲームパッド コントローラー') }&tag=${aff.amazon_tag || ''}`;
      const amazonGameUrl = `https://www.amazon.co.jp/s?k=${encodedJa}+ゲーム&tag=${aff.amazon_tag || ''}`;
      const hasCustomBto = aff.bto_pc_link && !aff.bto_pc_link.includes("DUMMY_");
      const btoPcUrl = hasCustomBto
        ? aff.bto_pc_link
        : `https://www.amazon.co.jp/s?k=${encodeURIComponent('ゲーミングPC ' + game.gpu_hint)}&tag=${aff.amazon_tag || ''}`;
      return { fanaticalUrl, amazonControllerUrl, amazonGameUrl, btoPcUrl };
    }

    function renderDeals() {
      const grid = document.getElementById("dealsGrid");
      let list = [...DEALS_DATA.deals];

      list = list.filter(g => {
        if (currentFilter === "discount50" && g.discount_percent < 50) return false;
        if (currentFilter === "discount70" && g.discount_percent < 70) return false;
        if (currentFilter === "under1000" && g.final_price > 1000) return false;
        if (currentFilter === "verypos" && g.positive_rate < 80) return false;
        if (currentFilter === "ja" && !g.supported_japanese) return false;

        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          const inName = g.name.toLowerCase().includes(q);
          const inGenre = (g.genres || []).some(tag => tag.toLowerCase().includes(q));
          const inOverview = (g.ai_overview || "").toLowerCase().includes(q);
          if (!inName && !inGenre && !inOverview) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        if (currentSort === "discount") return b.discount_percent - a.discount_percent;
        if (currentSort === "price_asc") return a.final_price - b.final_price;
        if (currentSort === "rating") return b.positive_rate - a.positive_rate;
        return b.deal_score - a.deal_score;
      });

      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-sub);">条件に一致するセール中タイトルがありません。フィルタを変更してみてください。</div>`;
        return;
      }

      grid.innerHTML = list.map((game, idx) => {
        const links = buildExternalLinks(game);
        const fallbackImg = `https://cdn.akamai.steamstatic.com/steam/apps/${game.appid}/header.jpg`;

        // 上位3件（初期表示時）に「本日の目玉」ハイライトを付与して視線の起点を作る
        const isTopPick = (currentFilter === "all" && !currentSearch && currentSort === "score" && idx < 3 && game.deal_score >= 75);
        const topPickClass = isTopPick ? "top-pick" : "";
        const topPickRibbon = isTopPick
          ? `<div class="top-pick-ribbon">👑 本日の目玉セール TOP${idx + 1}（お得度 ${game.deal_score}点）</div>`
          : "";

        // 好評率の3段階カラー分け（75%以上:スカイブルー / 50〜74%:アンバー / 49%以下:レッド）
        let reviewClass = "";
        let warnIconClass = "point-icon-warn";
        if (game.positive_rate < 50) {
          reviewClass = "bad";
          warnIconClass = "point-icon-bad";
        } else if (game.positive_rate < 75) {
          reviewClass = "mixed";
        }

        const jaBadge = game.supported_japanese ? "🗾 日本語対応" : "🌐 英語/他言語";

        const prosHtml = (game.ai_pros || []).map(p =>
          `<div class="point-item"><span class="point-icon-good">✔</span><span>${p}</span></div>`
        ).join("");

        // 注意点（⚠️）は本当に注意がある時だけ表示される
        const consHtml = (game.ai_cons || []).map(c =>
          `<div class="point-item"><span class="${warnIconClass}">⚠️</span><span>${c}</span></div>`
        ).join("");

        const keyStoreLink = game.has_key_store
          ? `<a class="text-link" style="color:#34d399; font-weight:700;" href="${links.fanaticalUrl}" target="_blank" rel="noopener">🔑 Fanatical(公認キー)で価格比較 ↗</a>`
          : "";

        const hardwareLink = game.has_controller
          ? `<a class="text-link" href="${links.amazonControllerUrl}" target="_blank" rel="noopener">🎮 おすすめパッド(Amazon) ↗</a>`
          : `<a class="text-link" href="${links.amazonControllerUrl}" target="_blank" rel="noopener">🎧 ゲーミング周辺機器(Amazon) ↗</a>`;

        const pcLink = `<a class="text-link" href="${links.btoPcUrl}" target="_blank" rel="noopener">💻 推奨:${game.gpu_hint} 快適PC ↗</a>`;

        const savedAmount = Math.max(0, (game.initial_price || 0) - (game.final_price || 0));
        const steamBtnText = savedAmount > 0
          ? `🎮 Steamで見る（¥${savedAmount.toLocaleString()}得）↗`
          : `🎮 Steam公式でセールを見る ↗`;

        return `
          <article class="deal-card ${topPickClass}">
            ${topPickRibbon}
            <div class="card-top">
              <a class="card-thumb" href="${game.steam_url}" target="_blank" rel="noopener" title="${game.name} のSteamページを開く">
                <img src="${game.header_image}" alt="${game.name}" onerror="if(this.src!=='${fallbackImg}'){this.src='${fallbackImg}';}" />
                <div class="lang-badge">${jaBadge}</div>
              </a>

              <div class="card-top-info">
                <div class="title-price-row">
                  <h2 class="game-title"><a href="${game.steam_url}" target="_blank" rel="noopener">${game.name}</a></h2>

                  <div class="price-cluster">
                    <span class="discount-badge">-${game.discount_percent}%</span>
                    <div class="price-stack">
                      <span class="old-price">${game.initial_formatted}</span>
                      <span class="new-price">${game.final_formatted}</span>
                    </div>
                  </div>
                </div>

                <div class="meta-row">
                  <span class="score-pill">お得度 <strong>${game.deal_score}</strong>点</span>
                  <span class="review-pill ${reviewClass}">${game.review_desc} (${game.positive_rate}% / ${game.total_reviews.toLocaleString()}件)</span>
                </div>

                <div class="meta-row">
                  ${(game.genres || []).slice(0, 4).map(g => `<span class="genre-tag">${g}</span>`).join("")}
                </div>
              </div>
            </div>

            <div class="ai-box">
              <div class="ai-overview">${game.ai_overview}</div>
              <div class="ai-points">
                ${prosHtml}
                ${consHtml}
              </div>
            </div>

            <div class="cta-section">
              <div class="primary-cta-row">
                <a class="btn-steam-main" href="${game.steam_url}" target="_blank" rel="noopener">${steamBtnText}</a>
                <a class="btn-amazon-main" href="${links.amazonGameUrl}" target="_blank" rel="noopener">📦 Amazonで他機種・関連品を見る ↗</a>
              </div>
              <div class="sub-links-row">
                <div class="context-links">
                  ${keyStoreLink}
                  ${hardwareLink}
                  ${pcLink}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderDeals();
      });
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      currentSearch = e.target.value.trim();
      renderDeals();
    });

    document.getElementById("sortSelect").addEventListener("change", e => {
      currentSort = e.target.value;
      renderDeals();
    });

    renderDeals();
  </script>
</body>
</html>
